<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="120" height="120" rx="28" fill="#0A0A0A" />
  <rect width="116" height="116" x="2" y="2" rx="26" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Cloche Handle -->
  <circle cx="60" cy="24" r="5" fill="url(#gold)" filter="url(#glow)" />
  <rect x="57" y="27" width="6" height="4" rx="2" fill="url(#gold)" />

  <!-- Cloche Dome -->
  <path d="M26 62C26 42 41 29 60 29C79 29 94 42 94 62" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Inner Flame -->
  <path d="M60 38C58 45 52 48 55 54C57 58 63 58 64 54C65 49 61 46 60 38Z" fill="url(#flame)" filter="url(#glow)" />
  <path d="M50 49C48 53 51 57 55 57C53 54 52 52 50 49Z" fill="url(#flame)" />
  <path d="M70 49C72 53 69 57 65 57C67 54 68 52 70 49Z" fill="url(#flame)" />

  <!-- Cloche Platter Base -->
  <path d="M22 65H98" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Stylized TT Monogram -->
  <!-- Left T -->
  <path d="M36 71H56M46 71V98C46 101 42 103 38 100" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Right T Interlocking -->
  <path d="M64 71H84M74 71V98C74 101 78 103 82 100" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>